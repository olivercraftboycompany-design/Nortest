<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA — Audio Player</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <header class="app-header glass">
    <div class="logo"><span class="logo-icon" id="logo-icon"><img src="logo.png" alt="NOVA"></span>NOVA</div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" data-action="open-theme" title="Theme color"></button>
      <button class="icon-btn" data-action="upload" title="Upload tracks"></button>
      <button class="icon-btn" data-action="open-settings" title="Settings"></button>
    </div>
  </header>

  <nav class="tabs-row">
    <button class="tab-btn active" data-tab="library">Library</button>
    <button class="tab-btn" data-tab="playlists">Playlists</button>
    <button class="tab-btn" data-tab="albums">Albums</button>
    <button class="tab-btn" data-tab="favorites">Favorites</button>
    <button class="tab-btn" data-tab="queue">Queue</button>
    <button class="tab-btn" data-tab="history">History</button>
  </nav>

  <main id="main-content"></main>
</div>

<div id="mini-player" class="hidden">
  <div class="mini-player-inner glass">
    <input type="range" id="mini-seek" class="seek mini-seek" min="0" max="1000" value="0">
    <div class="mini-seek-times"><span id="mini-elapsed">0:00</span><span id="mini-duration">0:00</span></div>
    <div class="mini-player-row" data-action="open-full-player">
      <div class="track-cover" id="mini-cover"></div>
      <div class="track-meta">
        <div class="track-title" id="mini-title">—</div>
        <div class="track-artist" id="mini-artist">—</div>
        <div class="mini-next" id="mini-next">Up next: —</div>
        <div class="output-badge hidden" id="mini-output-badge"></div>
      </div>
      <div class="mini-controls">
        <button class="icon-btn sm" data-action="toggle-shuffle" id="mini-shuffle-btn" title="Shuffle"></button>
        <button class="icon-btn" data-action="prev" title="Previous"></button>
        <button class="icon-btn lg" data-action="playpause" title="Play/Pause"></button>
        <button class="icon-btn" data-action="next" title="Next"></button>
        <button class="icon-btn sm" data-action="toggle-repeat" id="mini-repeat-btn" title="Repeat"></button>
      </div>
    </div>
  </div>
</div>

<div id="full-player">
  <div class="full-player-bg">
    <img class="full-bg-img" id="full-bg-img" alt="">
    <div class="full-player-tint" id="full-player-tint"></div>
  </div>
  <div class="full-player-content">
    <div class="full-top-row">
      <button class="icon-btn" data-action="close-full-player" title="Minimize"></button>
      <span style="font-size:11px; letter-spacing:.12em; color:#a9b6d1; font-weight:700;">NOW PLAYING</span>
      <div style="display:flex; gap:6px;">
        <button class="icon-btn" data-action="open-sound-settings" title="Sound settings"></button>
        <button class="icon-btn" data-action="open-pip" title="Floating player"></button>
        <button class="icon-btn" data-action="open-cast" title="Cast to device"></button>
        <button class="icon-btn" data-action="toggle-fullscreen" title="Full screen"></button>
      </div>
    </div>
    <div class="full-body">
      <div class="full-cover-wrap" id="full-cover-wrap"></div>
      <div class="full-meta">
        <div class="full-title" id="full-title">—</div>
        <div class="full-artist" id="full-artist">—</div>
        <div class="output-badge hidden" id="full-output-badge" style="margin-top:8px;"></div>
      </div>
    </div>
    <div class="full-glass-panel glass">
    <div class="full-seek-wrap">
      <input type="range" id="full-seek" class="seek" min="0" max="1000" value="0">
      <div class="full-seek-times"><span id="full-elapsed">0:00</span><span id="full-duration">0:00</span></div>
    </div>
    <div class="full-controls-main">
      <button class="icon-btn" data-action="toggle-shuffle" title="Shuffle"></button>
      <button class="icon-btn" data-action="prev" title="Previous"></button>
      <button class="btn-play-lg" data-action="playpause" title="Play/Pause"></button>
      <button class="icon-btn" data-action="next" title="Next"></button>
      <button class="icon-btn" data-action="toggle-repeat" title="Repeat"></button>
    </div>
    <div class="full-controls-secondary">
      <button class="icon-btn" data-action="seek-back-10" title="Rewind 10s"></button>
      <button class="icon-btn" id="full-favorite" data-action="toggle-fav" title="Favorite"></button>
      <button class="icon-btn" data-action="seek-fwd-10" title="Forward 10s"></button>
    </div>
    <div class="full-controls-tertiary" style="flex-wrap:wrap;gap:8px;">
      <button class="chip-btn" data-action="open-lyrics" title="Lyrics via lrclib.net API"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/></svg> Lyrics</button>
      <button class="chip-btn" data-action="share-track" title="Web Share API">Share</button>
      <button class="chip-btn" data-action="open-output" title="Audio Output Devices API">Output</button>
      <button class="chip-btn" data-tab="queue" data-action="goto-queue">Queue</button>
      <button class="chip-btn" data-tab="history" data-action="goto-history">History</button>
    </div>
    </div>
  </div>
</div>

<div id="presentation-view" class="hidden" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%, #0d2050 0%, transparent 45%),radial-gradient(circle at 85% 0%, #0a1840 0%, transparent 40%),linear-gradient(160deg,#040611 0%,#070f26 45%,#0a1638 100%);">
  <div class="glass" style="width:min(92vw,480px);padding:32px;border-radius:28px;text-align:center;">
    <p style="font-size:11px;letter-spacing:.16em;opacity:.5;text-transform:uppercase;margin:0 0 18px;">Now Playing</p>
    <div id="pv-cover" style="width:200px;height:200px;margin:0 auto 20px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#1e3a8a,#0a1128);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);"></div>
    <div id="pv-title" style="font-size:22px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Waiting for connection…</div>
    <div id="pv-artist" style="font-size:15px;opacity:.65;margin-bottom:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">—</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <span id="pv-elapsed" style="font-size:11px;opacity:.55;width:38px;">0:00</span>
      <div style="flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;"><div id="pv-progress-fill" style="height:100%;width:0%;background:var(--accent);"></div></div>
      <span id="pv-duration" style="font-size:11px;opacity:.55;width:38px;text-align:right;">0:00</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin:22px 0 18px;">
      <button id="pv-prev" class="icon-btn" style="width:44px;height:44px;"></button>
      <button id="pv-playpause" class="icon-btn" style="width:60px;height:60px;background:var(--accent);color:#04101f;"></button>
      <button id="pv-next" class="icon-btn" style="width:44px;height:44px;"></button>
    </div>
    <p id="pv-next-track" style="font-size:12.5px;opacity:.55;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">—</p>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-container"></div>

<input type="file" id="file-input" accept="audio/*" multiple class="hidden">
<audio id="audio-el" preload="metadata"></audio>
<img id="cover-source" class="hidden" alt="">
<video id="pip-video" muted playsinline class="hidden"></video>
<canvas id="pip-canvas" width="480" height="270" class="hidden"></canvas>

<script src="script.js"></script>
</body>
</html>
